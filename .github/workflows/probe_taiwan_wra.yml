name: Temporary probe (throwaway branch)

on:
  push:
    branches: [claude/taiwan-wra-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python probe_taiwan_wra.py
