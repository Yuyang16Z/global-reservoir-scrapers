name: tmp Luxembourg endpoint discovery

# Temporary, removed before merge. Round 3: the new portal's graph component for
# Barrage Esch-Sauer reads /content/dam/inondations/ctie/datas/Esch-Sure.json.
# Print that file's structure so the scraper can be adapted to it.
on:
  push:
    branches: [claude/friendly-rubin-w6s3d6]
    paths: [.github/workflows/tmp_luxembourg_discovery.yml]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Structure of the Esch-Sure graph JSON
        shell: python
        run: |
          import json
          import urllib.request

          url = "https://inondations.public.lu/content/dam/inondations/ctie/datas/Esch-Sure.json"
          req = urllib.request.Request(url, headers={"User-Agent": "global-reservoir-scrapers/1.0"})
          with urllib.request.urlopen(req, timeout=60) as r:
              body = r.read()
              print(f"HTTP {r.status} {r.geturl()} {r.headers.get('Content-Type')!r} "
                    f"{len(body)} bytes, Last-Modified={r.headers.get('Last-Modified')!r}")
          data = json.loads(body)

          def describe(node, path="$", depth=0):
              pad = "  " * depth
              if isinstance(node, dict):
                  print(f"{pad}{path}: object with {len(node)} keys")
                  for key, value in list(node.items())[:40]:
                      if isinstance(value, (dict, list)):
                          describe(value, f"{path}.{key}", depth + 1)
                      else:
                          print(f"{pad}  {path}.{key} = {value!r}"[:300])
              elif isinstance(node, list):
                  print(f"{pad}{path}: list of {len(node)}")
                  for i, item in enumerate(node[:3]):
                      print(f"{pad}  [{i}] {json.dumps(item, ensure_ascii=False)[:400]}")
                  if len(node) > 3:
                      print(f"{pad}  [-1] {json.dumps(node[-1], ensure_ascii=False)[:400]}")
                  if node and isinstance(node[0], dict):
                      keys = sorted({k for item in node if isinstance(item, dict) for k in item})
                      print(f"{pad}  item keys: {keys}")

          describe(data)
