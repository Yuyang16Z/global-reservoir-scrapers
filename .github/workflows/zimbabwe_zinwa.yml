name: Zimbabwe ZINWA dam levels scrape

on:
# DISABLED SCHEDULE - licence gate.
# This source's data is `undeclared_review` (see DATA_LICENCE_NOTICE.md) and
# this repository is currently public, so a scheduled run would commit
# restricted data publicly. The registry keeps it at
# deployment_status=prepared. Restore the `schedule:` block below once the
# repository is private or the source grants written permission; the cron
# values are recorded in config/windowed_sources.json.
  # schedule:
  # # Tuesday and Friday 06:10 UTC. ZINWA refreshes the page roughly
  # # weekly on Mondays (Africa/Harare = UTC+2); the Friday run recovers
  # # a missed Tuesday before the next overwrite.
  # - cron: "10 6 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zimbabwe-zinwa
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/zimbabwe/zinwa
        run: python scrapers/zimbabwe/zinwa/zimbabwe_zinwa_scraper.py

      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zimbabwe/zinwa
          git add scrapers/zimbabwe/zinwa
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(zimbabwe/zinwa): scheduled scrape ${ts}"
          git pull --rebase origin main
          git push
