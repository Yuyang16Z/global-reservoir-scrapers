name: Mozambique HCB Cahora Bassa scrape

on:
  # Collection is deliberate and internal: this source's data carries
  # `undeclared_review` terms (see DATA_LICENCE_NOTICE.md) and is gathered here
  # for research. Redistribution is a separate, human-confirmed step - presence
  # in this repository is not permission to republish.
  schedule:
    # 04:20 and 15:20 UTC (06:20 / 17:20 Africa/Maputo). The endpoint returns
    # the whole retained table, so either run recovers the day; the second is
    # insurance against a morning outage and against GitHub cron delay.
    - cron: "20 4 * * *"
    - cron: "20 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mozambique-hcb
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/mozambique/hcb
        run: python scrapers/mozambique/hcb/mozambique_hcb_scraper.py

      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mozambique/hcb
          git add scrapers/mozambique/hcb
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(mozambique/hcb): scheduled scrape ${ts}"
          git pull --rebase origin main
          git push
