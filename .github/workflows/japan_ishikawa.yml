name: Japan Ishikawa dams scrape

# The day file accumulates hourly points from 00:00 JST and resets at midnight; past
# dates 404. The 23:50 JST run captures the whole day on its own; the others are
# insurance against it failing.
on:
  schedule:
    - cron: "55 14 * * *"
    - cron: "55 8 * * *"
    - cron: "55 2 * * *"
    - cron: "55 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: japan-ishikawa
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/japan/ishikawa
          TZ: Asia/Tokyo
        run: python scrapers/japan/ishikawa/japan_ishikawa_scraper.py
      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/japan/ishikawa scrapers/japan/ishikawa .github/workflows/japan_ishikawa.yml
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(japan/ishikawa): scheduled scrape ${ts}"
          # Several scrapers can finish at once and race for the ref, so retry
          # the rebase-and-push instead of failing a run whose data is fine.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt ${attempt} lost the race; retrying"
            sleep $((attempt * 10))
          done
          echo "Push failed after 5 attempts." >&2
          exit 1
