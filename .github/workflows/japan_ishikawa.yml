name: Japan Ishikawa dams scrape

# One file per JST day holds that day's hourly points, and past day files stay up for
# a few days (checked 2026-10-06: the three previous days complete, a week-old day
# 404). Every run re-reads the last three days, so the evening hours that a run landing
# before midnight misses are filled in by the next morning's runs; scheduled runs
# start hours late, so no run can be relied on to land just before midnight.
on:
  schedule:
    - cron: "55 14 * * *"
    - cron: "55 8 * * *"
    - cron: "55 2 * * *"
    - cron: "55 20 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Past day files to re-read (default 3; they expire within a week)"
        required: false

permissions:
  contents: write

concurrency:
  group: japan-ishikawa
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/japan/ishikawa
          TZ: Asia/Tokyo
          DAYS_BACK: ${{ github.event.inputs.days_back || '3' }}
        run: python scrapers/japan/ishikawa/japan_ishikawa_scraper.py
      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/japan/ishikawa scrapers/japan/ishikawa .github/workflows/japan_ishikawa.yml
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(japan/ishikawa): scheduled scrape ${ts}"
          # Several scrapers can finish at once and race for the ref, so retry
          # the rebase-and-push instead of failing a run whose data is fine.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt ${attempt} lost the race; retrying"
            sleep $((attempt * 10))
          done
          echo "Push failed after 5 attempts." >&2
          exit 1
