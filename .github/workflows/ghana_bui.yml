name: Ghana Bui Power reservoir scrape

on:
  # Collection is deliberate and internal: this source's data carries
  # `undeclared_review` terms (see DATA_LICENCE_NOTICE.md) and is gathered here
  # for research. Redistribution is a separate, human-confirmed step - presence
  # in this repository is not permission to republish.
  schedule:
    # 06:30 and 17:30 UTC (= Africa/Accra). The JSON trends roll off after about
    # a year and the spot inflow/outflow reading has no history at all, so the
    # evening run captures changes the morning run would miss.
    - cron: "30 6 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ghana-bui
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/ghana/bui
        run: python scrapers/ghana/bui/ghana_bui_scraper.py

      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ghana/bui
          git add scrapers/ghana/bui
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(ghana/bui): scheduled scrape ${ts}"
          git pull --rebase origin main
          git push
