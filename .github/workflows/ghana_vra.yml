name: Ghana VRA Akosombo level scrape

on:
  # Collection is deliberate and internal: this source's data carries
  # `undeclared_review` terms (see DATA_LICENCE_NOTICE.md) and is gathered here
  # for research. Redistribution is a separate, human-confirmed step - presence
  # in this repository is not permission to republish.
  schedule:
    # 06:35 and 16:35 UTC (= Africa/Accra), bracketing the working-day update.
    # The widget is a current-value snapshot with no archive, so an unobserved
    # change is lost permanently.
    - cron: "35 6 * * *"
    - cron: "35 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ghana-vra
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/ghana/vra
        run: python scrapers/ghana/vra/ghana_vra_scraper.py

      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ghana/vra
          git add scrapers/ghana/vra
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(ghana/vra): scheduled scrape ${ts}"
          git pull --rebase origin main
          git push
