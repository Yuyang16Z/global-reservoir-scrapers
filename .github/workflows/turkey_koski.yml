name: Turkey KOSKİ dam readings

on:
  # KOSKİ publishes no reuse terms; its footer reserves all rights (reuse_status
  # `undeclared_review`, see DATA_LICENCE_NOTICE.md). Collected here by owner
  # decision, with the PI managing the repository's public exposure. Presence
  # in this repository is not permission to republish.
  schedule:
    # Mondays 14:40 Europe/Istanbul (UTC+3, no DST). The four dam pages are a
    # rolling window of six years, so each date stays visible for about 300
    # weekly runs and a missed or late run loses nothing: the next run reads the
    # whole window again.
    - cron: "40 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turkey-koski
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/turkey/koski
        run: python scrapers/turkey/koski/turkey_koski_scraper.py

      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/turkey/koski
          git add scrapers/turkey/koski
          # Every run writes a run summary; commit only when a new page or a
          # changed table was stored.
          if git diff --cached --quiet -- data/turkey/koski/raw data/turkey/koski/timeseries; then
            echo "No new data; not committing."
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(turkey/koski): scheduled scrape ${ts}"
          # Several scrapers can finish at once and race for the ref, so retry
          # the rebase-and-push instead of failing a run whose data is fine.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt ${attempt} lost the race; retrying"
            sleep $((attempt * 10))
          done
          echo "Push failed after 5 attempts." >&2
          exit 1
