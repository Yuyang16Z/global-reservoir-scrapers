name: Taiwan WRA scrape

# WRA's daily reservoir figures reach non-government users only through its
# open data, and the daily-operations dataset there holds a single day (the
# previous day's values), replaced once a day. The keyless history API that a
# weekly run used to backfill 15 days from (fhy.wra.gov.tw/WraApi/v1) was
# retired in June 2026; its successor, FHY General API v2, needs a key WRA
# issues to government bodies. So a day is lost unless a run lands inside its
# 24-hour window. Scheduled runs start hours late, by varying amounts (median
# about 5 h, see README.md "Scheduled runs"), so two consecutive once-a-day
# runs can land more than 24 hours apart and skip a day. Runs 12 hours apart
# keep at least one run in every window.
on:
  schedule:
    # 01:45 and 13:45 UTC (09:45 and 21:45 Asia/Taipei).
    - cron: "45 1,13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: taiwan-wra
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/taiwan/wra
        run: python scrapers/taiwan/wra/taiwan_wra_scraper.py

      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/taiwan/wra
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(taiwan/wra): scheduled scrape ${ts}"
          # Several scrapers can finish at once and race for the ref, so retry
          # the rebase-and-push instead of failing a run whose data is fine.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt ${attempt} lost the race; retrying"
            sleep $((attempt * 10))
          done
          echo "Push failed after 5 attempts." >&2
          exit 1
