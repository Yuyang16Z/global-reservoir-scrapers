name: South Africa Cape Town WCWSS weekly dashboard

on:
  # Collection is deliberate and internal: this source's data carries
  # `undeclared_review` terms (see DATA_LICENCE_NOTICE.md) and is gathered here
  # for research. Redistribution is a separate, human-confirmed step - presence
  # in this repository is not permission to republish.
  schedule:
    # Tuesday and Thursday 09:00 UTC (11:00 SAST). One weekly dashboard sits at a
    # stable URL that is overwritten, so a missed week cannot be recovered from
    # the source; Thursday is the recovery attempt.
    - cron: "0 9 * * 2"
    - cron: "0 9 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: southafrica-capetown-wcwss
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        id: scrape
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/southafrica/capetown_wcwss
        run: python scrapers/southafrica/capetown_wcwss/southafrica_capetown_wcwss_scraper.py

      # The dashboard PDF is overwritten weekly. Both runs for the 2026-09-14
      # dashboard fetched it and then failed to parse its date, and the PDF was
      # never committed, so it can neither be re-parsed nor inspected. When the
      # scrape fails, commit just the raw PDF and the run log - never half-merged
      # outputs. The failed scrape step still turns the run red.
      - name: Commit & push new data
        if: ${{ !cancelled() && steps.scrape.outcome != 'skipped' }}
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$SCRAPE_OUTCOME" = "success" ]; then
            git add data/southafrica/capetown_wcwss
            git add scrapers/southafrica/capetown_wcwss
            msg="scheduled scrape"
          else
            git add data/southafrica/capetown_wcwss/raw data/southafrica/capetown_wcwss/run_logs
            # Revert whatever else the failed run touched: it must not be committed,
            # and `git pull --rebase` below refuses to run over unstaged changes.
            git checkout -- data/southafrica/capetown_wcwss
            msg="failed scrape, raw PDF and run log kept"
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(southafrica/capetown_wcwss): ${msg} ${ts}"
          # Several scrapers can finish at once and race for the ref, so retry
          # the rebase-and-push instead of failing a run whose data is fine.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt ${attempt} lost the race; retrying"
            sleep $((attempt * 10))
          done
          echo "Push failed after 5 attempts." >&2
          exit 1
