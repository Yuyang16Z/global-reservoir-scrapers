name: Japan Kanagawa dams scrape

# The API publishes one value per day (`lastUpdate`) and keeps no retrievable history
# on a usable time axis, so a missed day cannot be recovered. Captured twice daily
# with a wide separation.
on:
  schedule:
    - cron: "50 3 * * *"
    - cron: "50 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: japan-kanagawa
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/japan/kanagawa
          TZ: Asia/Tokyo
        run: python scrapers/japan/kanagawa/japan_kanagawa_scraper.py
      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/japan/kanagawa scrapers/japan/kanagawa .github/workflows/japan_kanagawa.yml
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(japan/kanagawa): scheduled scrape ${ts}"
          git pull --rebase origin main
          git push
