name: Japan kawabou national dams scrape

# Two windows of different depth:
#   past    7 days hourly, but only 貯水位 / 流入量 / 全放流量
#   current ~50h hourly, with 貯水量 and the percentages as well
# Daily, so a missed run costs nothing for the three core variables and costs storage
# only if two consecutive days fail. 04:20 JST = 19:20 UTC.
# SCHEDULE PAUSED 2026-09-16. The site's usage notes ask that data not be collected
# periodically with tools because of the load it puts on the servers, and direct regular
# collection - commercial or not - to the River Information Numerical Data Distribution
# service: https://www.river.go.jp/kawabou/kwb_apend/html/caution.html
# That is a request about the collection method, not a reuse term: the content terms stay
# open (Government of Japan Standard Terms of Use 2.0, stated compatible with CC BY 4.0),
# so what is already archived remains usable. Manual runs stay available while the project
# decides between subscribing to the distribution service and asking MLIT for permission.
# The paused schedule was: cron "20 19 * * *" (04:20 JST).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: japan-kawabou
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/japan/kawabou
          TZ: Asia/Tokyo
        run: python scrapers/japan/kawabou/japan_kawabou_scraper.py
      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/japan/kawabou scrapers/japan/kawabou .github/workflows/japan_kawabou.yml
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(japan/kawabou): scheduled scrape ${ts}"
          # Several scrapers can finish at once and race for the ref, so retry
          # the rebase-and-push instead of failing a run whose data is fine.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt ${attempt} lost the race; retrying"
            sleep $((attempt * 10))
          done
          echo "Push failed after 5 attempts." >&2
          exit 1
