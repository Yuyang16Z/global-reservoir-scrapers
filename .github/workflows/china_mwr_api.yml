name: China MWR API scrape

# The MWR page is a current realtime table, but its report time is normally
# 08:00 Beijing. Start at 12:20 and 20:20 Beijing time, then add a random
# 0-20 minute delay. This gives two capture opportunities centered near 12:30
# and 20:30 without sending the request at the same minute every day.
#
# The jitter reduces the chance of colliding with other synchronised jobs. It is
# NOT a countermeasure to bot detection, and this source has never shown any.
# The 2026-09-02..08 outage was `Network is unreachable` -- an L3 routing failure,
# with no 403, 429, CAPTCHA or ban notice anywhere in the logs -- and was fixed by
# the transport fallback, not by jitter.
#
# IF THIS WORKFLOW FAILS AGAIN: read the failure mode before changing the schedule.
#   `Network is unreachable` / `Connection timed out` -> routing problem. Check the
#     runner's egress, the fallback path, and retry behaviour. Do NOT tune timing.
#   403 / 429 / CAPTCHA page / explicit ban / rejection tied to a UA or IP range
#     -> only then treat it as bot detection.
# Tuning the schedule against an L3 failure will mask the real cause.
# The scraper is API-first and uses historical OCR CSVs only to decode the
# site's custom-font obfuscation.
on:
  schedule:
    - cron: "20 4,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: china-mwr-api
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Add bounded schedule jitter
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          delay_seconds=$(python -c 'import secrets; print(secrets.randbelow(1201))')
          echo "Waiting ${delay_seconds}s before the scheduled MWR request."
          sleep "${delay_seconds}"

      - name: Run scraper
        env:
          TZ: Asia/Shanghai
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "China MWR scrape attempt ${attempt}/3"
            if python scrapers/china/mwr_api/china_mwr_api_scraper.py; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "China MWR scrape failed after 3 attempts."
              exit 1
            fi
            echo "Scrape failed; waiting 5 minutes before retry."
            sleep 300
          done

      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/china/mwr_api
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(china/mwr_api): scheduled scrape ${ts}"
          for attempt in 1 2; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            if [ "$attempt" = "2" ]; then
              echo "Commit push failed after 2 attempts."
              exit 1
            fi
            echo "Push failed; retrying after 30 seconds."
            sleep 30
          done
