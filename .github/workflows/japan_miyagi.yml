name: Japan Miyagi dams scrape

# overwrite_prone: only the current issue is kept on the site and the Internet Archive
# holds no usable series, so a missed issue is lost. The bulletin is monthly, but the
# publication day is not fixed and the filename convention has changed, so the landing
# page is polled daily and the accumulator dedups repeated issue dates.
on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: japan-miyagi
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/japan/miyagi
          TZ: Asia/Tokyo
        run: python scrapers/japan/miyagi/japan_miyagi_scraper.py
      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/japan/miyagi scrapers/japan/miyagi .github/workflows/japan_miyagi.yml
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(japan/miyagi): scheduled scrape ${ts}"
          git pull --rebase origin main
          git push
