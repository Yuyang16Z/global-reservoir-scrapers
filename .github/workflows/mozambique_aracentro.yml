name: Mozambique ARA-Centro bulletin scrape

on:
  # Collection is deliberate and internal: this source's data carries
  # `undeclared_review` terms (see DATA_LICENCE_NOTICE.md) and is gathered here
  # for research. Redistribution is a separate, human-confirmed step - presence
  # in this repository is not permission to republish.
  schedule:
    # Twice a month (1st and 16th), 05:00 UTC. Retention class permanent_archive:
    # published bulletins persist indefinitely, so a fortnight's backlog is simply
    # downloaded on the next run. The per-run cap of 40 PDFs covers a fortnight of
    # daily rainy-season bulletins; the host serves at about 11 KB/s, hence the
    # 60-minute timeout.
    - cron: "0 5 1,16 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mozambique-aracentro
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          OUTPUT_DIR: ${{ github.workspace }}/data/mozambique/aracentro
          ARACENTRO_MAX_NEW: "40"
        run: python scrapers/mozambique/aracentro/mozambique_aracentro_scraper.py

      - name: Commit & push new data
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mozambique/aracentro
          git add scrapers/mozambique/aracentro
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "data(mozambique/aracentro): scheduled scrape ${ts}"
          # Several scrapers can finish at once and race for the ref, so retry
          # the rebase-and-push instead of failing a run whose data is fine.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt ${attempt} lost the race; retrying"
            sleep $((attempt * 10))
          done
          echo "Push failed after 5 attempts." >&2
          exit 1
